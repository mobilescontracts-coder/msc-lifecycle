[project]
name = "spos-msc-prototype"
version = "0.1.0"
description = "Prototype emulator for a mobile-aware smart-contract lifecycle with SPoS consensus."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pandas==2.2.3",
  "openpyxl==3.1.5",
  "numpy==2.2.1",
  "python-dotenv==1.0.1",
]

[tool.ruff]
line-length = 100
src = ["spos_msc", "scripts", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
