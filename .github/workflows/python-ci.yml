name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run prototype tests
        run: pytest -q
      - name: Check Python sources
        run: ruff check spos_msc scripts analysis tests
      - name: Rebuild committed summaries
        run: |
          python analysis/summarise_cpn_proxy.py
          python analysis/summarise_prototype.py
          python analysis/generate_figures.py
      - name: Validate repository
        run: python scripts/validate_repository.py
