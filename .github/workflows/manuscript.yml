name: Manuscript build

on:
  push:
    paths:
      - 'manuscript/**'
      - '.github/workflows/manuscript.yml'
  pull_request:
    paths:
      - 'manuscript/**'
      - '.github/workflows/manuscript.yml'

jobs:
  latex:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: '1787011200'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Compile manuscript
        uses: xu-cheng/latex-action@v4
        with:
          root_file: Manuscript_SMPT.tex
          working_directory: manuscript
          texlive_version: 2026
          os: debian
